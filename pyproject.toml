[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slideqc"
version = "0.1.0"
description = "Whole-slide focus quality and targeted rescan simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "openslide-python>=1.4,<2",
  "openslide-bin>=4.0,<5",
  "Pillow>=10.4,<13",
  "streamlit>=1.67,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
slideqc = "slideqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slideqc = ["tile_picker/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

